<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102c34">
<meta name="description" content="Operación X · Misión 1. Actividad gamificada para traducir situaciones cotidianas a expresiones algebraicas.">
<title>Operación X · Misión 1 — Descifradores del código</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23102c34'/%3E%3Cpath d='M18 18l28 28M46 18L18 46' stroke='%23f7bb53' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --night:#102c34;--deep:#0b222a;--panel:#173b42;--mint:#60dec1;--green:#1ea987;--amber:#f7bb53;--amber-d:#b07829;
  --paper:#f9f6ed;--ink:#17323c;--muted:#4a6469;--steel:#9db9b9;--line:#34565d;--coral:#b9442f;
  --shadow:0 28px 70px rgba(14,35,40,.26);
  --math:"Times New Roman",Times,"Liberation Serif",serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(ellipse at 15% 0%,#dfebe3,transparent 38%),radial-gradient(ellipse at 100% 100%,#d7e8d9,transparent 34%),#e9e9de;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;min-height:100dvh}
body.lock{overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #e7a132;outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap}

/* Notación matemática */
.v{font-family:var(--math);font-style:italic;font-weight:700;font-size:1.12em;padding:0 .03em;line-height:1}
sup{font-size:.55em;line-height:0;vertical-align:.85em;font-weight:800}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.08;margin:0 .08em}
.frac>span:first-child{padding:0 .22em .07em;border-bottom:.075em solid currentColor}
.frac>span:last-child{padding-top:.07em}

#app{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:18px 0 28px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.frame{position:relative;background:var(--night);color:var(--paper);border:3px solid #0c242b;border-radius:30px;box-shadow:0 9px 0 #a2b5aa,var(--shadow);overflow:hidden;isolation:isolate}
.frame::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.42;background-image:radial-gradient(circle at 1px 1px,rgba(194,229,216,.13) 1px,transparent 0);background-size:25px 25px;z-index:-1}
.frame::after{content:"";position:absolute;inset:14px;border:1px solid rgba(113,150,160,.42);border-radius:20px;pointer-events:none}

/* HUD */
.hud{height:78px;margin:0 36px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(189,223,210,.2);position:relative;z-index:3}
.brand{display:flex;align-items:center;white-space:nowrap;font-size:18px;font-weight:900;letter-spacing:.03em;color:#fff;margin-right:8px}.brand .x{color:var(--amber);margin-left:.3em}
.hudtools{display:flex;align-items:center;gap:12px}
.points{display:flex;align-items:center;gap:7px;color:var(--amber);font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;margin-right:4px}
.points svg{width:21px;height:21px}.points small{font-size:12px;color:#b4d2cf;font-weight:700}
.points.pop{animation:pop .45s both}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.075);border:1px solid #688987;color:#eaf7ee;border-radius:100px;padding:8px 15px;font-size:13px;font-weight:800;min-height:42px;transition:background .16s,border-color .16s}
.pill:hover{background:rgba(255,255,255,.15);border-color:#acd0c2}
.pill svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill[aria-pressed="false"]{color:#b2cac5;border-color:#4f7473}
.pill:focus-visible{outline-color:var(--amber)}

.scene{padding:38px 50px 50px;position:relative;z-index:1}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.15em;color:#8cdbc5;text-transform:uppercase}

/* Intro */
.intro{display:flex;justify-content:center;text-align:center;min-height:540px;align-items:center}
.introContent{width:min(760px,100%);display:flex;flex-direction:column;align-items:center}
.headline{margin:14px 0 0;color:#fff;font-size:clamp(40px,7vw,72px);line-height:1.06;letter-spacing:-.03em;font-weight:900}
.headline .accent{color:#f4bf67}
.introDesc{margin:20px 0 30px;color:#d3e6e0;font-size:clamp(16px,1.7vw,19px);line-height:1.6;max-width:620px;text-wrap:balance}
.introDesc strong{display:block;margin-top:12px;color:#fff;font-weight:800;text-wrap:balance}
.board{width:min(700px,100%);background:#0a222b;border:4px solid #446870;border-radius:26px;padding:12px;box-shadow:0 14px 28px rgba(5,18,22,.55)}
.boardIn{background:var(--panel);border:2px solid #2d595a;border-radius:16px;padding:30px 22px 14px}
.boardBar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;padding-top:12px;border-top:1px solid #3d6264;font-size:12px;font-weight:800;letter-spacing:.1em;color:#b9d6d0;text-transform:uppercase}
.led{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--amber);margin-right:8px;box-shadow:0 0 8px rgba(247,187,83,.7);vertical-align:-1px;animation:blink 1.6s ease-in-out infinite}
.facts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px 0 30px;padding:0;list-style:none}
.facts li{border:1px solid #4d7075;background:rgba(255,255,255,.06);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;color:#d6e9e3}
.facts b{color:var(--amber);font-weight:900}
.primary{border:0;background:var(--amber);color:#1c3439;border-radius:16px;font-size:18px;font-weight:900;padding:15px 34px;box-shadow:0 6px 0 var(--amber-d);min-height:54px;transition:transform .15s,box-shadow .15s,background .15s}
.primary:hover{background:#ffd07a;transform:translateY(-2px);box-shadow:0 8px 0 var(--amber-d)}
.primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--amber-d)}
.ghost{background:transparent;color:#ecfbf4;border:1px solid #6e8c8a;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:800;min-height:46px}
.ghost:hover{background:rgba(255,255,255,.1)}

/* Circuito de avance (HTML, escala bien en cualquier pantalla) */
.track{--orb:50px;display:flex;list-style:none;margin:0;padding:0}
.track.big{--orb:66px}
.n{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.n+.n::before{content:"";position:absolute;top:calc(var(--orb)/2 - 3px);right:50%;width:100%;height:6px;border-radius:6px;background:repeating-linear-gradient(90deg,#547a78 0 10px,transparent 10px 19px)}
.n.from-ok::before{background:var(--mint);box-shadow:0 0 8px rgba(96,222,193,.45)}
.n.from-assisted::before{background:var(--amber)}
.n.from-current::before{background:repeating-linear-gradient(90deg,var(--amber) 0 8px,transparent 8px 15px);background-size:15px 6px;animation:flow .9s linear infinite}
.orb{position:relative;z-index:1;width:var(--orb);height:var(--orb);border-radius:50%;border:4px solid #527a78;background:#173943;color:#a9c8c3;display:grid;place-items:center;font-size:calc(var(--orb)*.42);font-weight:900;line-height:1}
.orb svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.n.ok .orb{background:#1f7a64;border-color:#54cda7;color:#effff8}
.n.assisted .orb{background:#7a5a2c;border-color:#f1b956;color:#ffe3a6}
.n.current .orb{background:#f2c26b;border-color:#ffe0a1;color:#17313b;box-shadow:0 0 0 6px rgba(247,187,83,.2),0 0 18px rgba(247,187,83,.45);animation:glow 2s ease-in-out infinite}
.nl{margin-top:9px;font-size:13px;font-weight:800;color:#c4dcd5;white-space:nowrap}
.n.current .nl{color:#ffcd73}

/* Reto */
.playHead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 20px}
.playHead h1{margin:4px 0 0;font-size:clamp(24px,2.9vw,34px);letter-spacing:-.025em;line-height:1.15;font-weight:900}
.step{font-weight:800;font-size:14px;white-space:nowrap;color:#bfe0d8}.step strong{color:#ffcd73;font-size:22px}
.circuitPanel{background:linear-gradient(180deg,#183f45,#14383e);border:1px solid #41666a;border-radius:20px;padding:16px 30px 20px;box-shadow:inset 0 3px 13px rgba(0,0,0,.21)}
.panelLabel{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#bcd8d3;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
.panelLabel span:first-child{white-space:nowrap}.panelLabel span:last-child{letter-spacing:.02em;text-transform:none;font-weight:700;font-size:13px;text-align:right}

.plate{margin:26px auto 0;background:var(--paper);color:var(--ink);border:4px solid #a6b9ad;border-bottom:10px solid #819e90;border-radius:24px;max-width:960px;padding:24px clamp(18px,4vw,44px) 28px;box-shadow:0 12px 0 rgba(8,26,29,.25),inset 0 0 0 2px #fff}
.challengeTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;min-height:38px}
.ctx{display:flex;align-items:center;gap:8px;color:#14675f;font-weight:900;letter-spacing:.11em;text-transform:uppercase;font-size:12px}
.ctx::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--amber);transform:rotate(45deg)}
.exampleBtn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid #9fbba7;border-radius:999px;background:#ecf5ea;color:#175f50;padding:7px 14px;font-size:13px;font-weight:800;min-height:40px;transition:background .16s,border-color .16s}
.exampleBtn:hover{background:#d8efdf;border-color:#54947b}.exampleBtn svg{width:18px;height:18px}
.prompt{font-size:clamp(22px,2.9vw,31px);line-height:1.25;max-width:780px;margin:0 auto 10px;text-align:center;letter-spacing:-.015em;font-weight:850;text-wrap:balance}
.promptQuestion{text-align:center;color:var(--muted);font-size:17px;font-weight:700;margin:0 auto 26px}
.cableDesk{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 0 28px}
.wireStub{height:6px;width:clamp(24px,10vw,130px);background:repeating-linear-gradient(90deg,#a2b3a9 0 12px,transparent 12px 20px);border-radius:8px}
.socket{width:210px;min-height:80px;border:3px dashed #7f9d95;border-radius:16px;background:#eef4e9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#4a6d65;gap:2px;padding:6px 10px;transition:background .15s,transform .15s,border-color .15s}
.sockHint{font-size:13px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
.sockExpr{font-size:30px;font-weight:900;line-height:1.15}
.sockTag{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.socket.drop{background:#d4f9e4;border-color:#127d72;transform:scale(1.05)}
.socket.correct{border-style:solid;border-color:#168b71;background:#d7f6e5;color:#0f5c4a}
.socket.guided{border-style:solid;border-color:#c48d33;background:#fff0d0;color:#7a4f12}
.pieces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:760px;margin:0 auto}
.piece{position:relative;min-height:94px;padding:10px 6px;background:linear-gradient(180deg,#fffdf5,#eceadd);border:2px solid #8ea9a4;border-bottom:7px solid #8ea9a4;border-radius:16px;font-weight:900;font-size:clamp(23px,3.1vw,34px);letter-spacing:-.01em;color:#193841;box-shadow:0 2px 7px rgba(9,50,40,.08);transition:transform .13s,background .13s,border-color .13s;touch-action:manipulation;user-select:none;-webkit-user-select:none;white-space:nowrap}
.piece::before{content:"";position:absolute;top:-2px;left:50%;width:30px;height:7px;margin-left:-15px;background:#c3d1c7;border-radius:0 0 7px 7px}
.piece:not([aria-disabled="true"]):hover{transform:translateY(-3px);border-color:#168b71;background:#fff}
.piece:not([aria-disabled="true"]):active{transform:translateY(3px);border-bottom-width:3px}
.piece[aria-disabled="true"]{cursor:default;box-shadow:none;color:#5a7176;background:#f1efe4}
.piece .badge{position:absolute;top:-11px;right:-8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid var(--paper)}
.piece .badge svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.piece.wrong{border-color:#d4705c;border-bottom-color:#d4705c;background:#fdf0ec;color:#8a3a2c}.piece.wrong .badge{background:var(--coral)}
.piece.right{border-color:#168b71;border-bottom-color:#168b71;background:#dcf5e6;color:#0f5c4a}.piece.right .badge{background:#138a6d}
.piece.reveal{border-color:#c48d33;border-bottom-color:#c48d33;background:#fff0d0;color:#7a4f12}.piece.reveal .badge{background:#a86d12}
.piece.shake{animation:shake .45s both}
.fbSlot{min-height:92px;margin:28px auto 0;max-width:760px;display:flex;flex-direction:column;justify-content:center}
.actionHint{text-align:center;font-size:14px;font-weight:700;color:var(--muted);margin:0}
.fb{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:15px 18px;border-radius:16px;border:2px solid;animation:rise .2s both}
.fb .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.fb .ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fb strong{display:block;font-size:16px;line-height:1.3}
.fb p{margin:3px 0 0;font-size:14.5px;line-height:1.5;font-weight:600}
.fb.good{background:#e0f5e7;border-color:#8fd5b0;color:#14553f}.fb.good .ico{background:#1a8a6c;color:#fff}
.fb.warn{background:#fff1d7;border-color:#efc07b;color:#6b4012}.fb.warn .ico{background:#f1b956;color:#3d2606}
.fb.guide{background:#f6efdc;border-color:#d7c18b;color:#5b4010}.fb.guide .ico{background:#e2b560;color:#3d2606}
.next{flex-shrink:0;border:0;border-radius:11px;background:#117969;color:#fff;padding:11px 20px;font-weight:900;font-size:15px;min-height:46px}
.next:hover{background:#0b6459}.next.alt{background:#8a5a14}.next.alt:hover{background:#744a0f}

/* Final */
.reward{display:flex;flex-direction:column;align-items:center;text-align:center}
.reward h1{font-size:clamp(34px,5.6vw,58px);margin:12px 0 10px;color:#fff;letter-spacing:-.03em;line-height:1.08;font-weight:900;text-wrap:balance}
.reward .lead{margin:0;color:#c6dcd5;font-size:17px;max-width:520px}
.rewardGrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:44px;align-items:center;margin:34px auto 0;width:min(900px,100%);text-align:left}
.keyCol{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.keyStage{position:relative;width:224px;height:224px;display:grid;place-items:center}
.keyStage::before{content:"";position:absolute;inset:0;border:2px dashed #5b7d76;border-radius:50%;animation:slowrot 26s linear infinite}
.keyPlate{width:128px;height:146px;border:4px solid #e7ad43;background:linear-gradient(145deg,#ffd67a,#e8a439);border-radius:18px 18px 36px 36px;color:#17333b;box-shadow:inset 0 6px rgba(255,255,255,.32),0 10px 0 #996b27,0 18px 28px #0b171a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.keyPlate span{font-size:12px;letter-spacing:.12em;font-weight:900}
.keyPlate strong{font-size:76px;line-height:1;font-weight:900}
.keyPlate small{font-size:11px;font-weight:900;letter-spacing:.08em}
.keyNote{margin:0;font-size:14px;font-weight:700;color:#ffdca0;max-width:210px;line-height:1.45}
.report{background:rgba(255,255,255,.06);border:1px solid #476c70;border-radius:20px;padding:22px 24px}
.score{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin:0 0 16px}
.score .big{font-size:34px;font-weight:900;color:var(--amber);line-height:1}.score .big small{font-size:16px;color:#bcd8d2;font-weight:700}
.score .rank{font-size:14px;font-weight:800;color:#d9efe8}.score .rank b{color:#fff}
.results{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.results li{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.2);border:1px solid #476c70;border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:700;color:#d6e9e3}
.results .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;background:#1f7a64;color:#fff}
.results .assisted .dot{background:#a86d12}
.whyTitle{margin:0 0 10px;font-size:15px;font-weight:900;color:#fff}
.ideas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.ideas li{display:flex;align-items:center;gap:11px;background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px;font-size:14px;color:#d6e9e3;line-height:1.3}
.ideas .op{flex:none;width:34px;height:34px;border-radius:10px;background:var(--amber);color:#1c3439;display:grid;place-items:center;font-size:20px;font-weight:900}
.ideas b{display:block;color:#fff;font-size:15px}
.ideas .ex{font-size:17px;color:#ffdca0;font-weight:800;line-height:1.2}.ideas .ex .frac{font-size:.82em}
.whyNote{margin:12px 0 0;font-size:13.5px;color:#bcd8d2;line-height:1.5}
.rewardActions{margin-top:34px}

/* Modales */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(5,22,29,.8);display:grid;place-items:center;padding:20px;animation:fade .15s both}
.dialog{background:#fffdf5;color:#18323a;width:min(460px,100%);max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;border-radius:22px;box-shadow:0 20px 60px #061418;padding:28px 26px 22px}
.dialog h2{font-size:24px;line-height:1.2;margin:0 0 14px}
.dialog p{line-height:1.55;margin:0 0 14px}
.dialog ul{padding-left:20px;margin:0 0 20px}.dialog li{margin-bottom:10px;line-height:1.5}
.dialog .primary{width:100%}
.dialogRow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.dialogRow button{min-height:50px;border-radius:14px;font-weight:900;font-size:15px;border:2px solid #9fb5aa;background:#fff;color:#1d3d40}
.dialogRow button:hover{background:#eef4ea}
.dialogRow .danger{background:#b9442f;border-color:#b9442f;color:#fff}.dialogRow .danger:hover{background:#a03824}
.linkBtn{display:block;width:100%;background:transparent;color:#3f5d57;border:none;border-radius:8px;padding:10px;margin-top:12px;font-size:14px;font-weight:750;text-decoration:underline;text-underline-offset:3px}
.linkBtn:hover{background:#eff3e8}
.overlay.side{display:flex;justify-content:flex-end;align-items:center;padding:clamp(12px,3vw,34px)}
.exampleCard{width:min(410px,100%);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;background:#fffaf0;border:3px solid #d9ad53;border-radius:24px;box-shadow:0 22px 0 rgba(4,22,27,.19),0 25px 60px rgba(3,18,24,.46);color:#193a41;animation:cardSlide .22s ease-out both}
.exampleTop{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#163842;color:#f8f3e5;padding:16px 18px 16px 22px;font-size:12px;font-weight:900;letter-spacing:.13em}
.closeX{width:40px;height:40px;border-radius:50%;border:2px solid #d7b067;background:transparent;color:#ffd27d;display:grid;place-items:center}
.closeX:hover{background:rgba(255,210,125,.15)}.closeX svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.exampleBody{padding:26px 24px 14px}
.exampleLabel{color:#14705b;font-size:12px;font-weight:900;letter-spacing:.12em;margin:0 0 10px}
.exampleBody h2{font-size:clamp(20px,2.5vw,24px);letter-spacing:-.02em;line-height:1.3;margin:0 0 18px;text-wrap:balance}
.studyBoard{display:flex;align-items:center;justify-content:center;min-height:112px;background:#e8f2e5;border:2px dashed #7fa392;border-radius:17px;padding:22px 14px}
.studyEq{font-size:clamp(28px,4vw,36px);font-weight:900;color:#124f49}
.exampleDetail{font-size:15.5px;line-height:1.55;color:#40605a;margin:18px 0 8px}
.exampleFoot{padding:10px 24px 24px}.exampleFoot p{margin:0 0 14px;color:#4f6b65;font-size:14px}.exampleFoot .next{width:100%}

<script>
window.OX_REF={intro:{tall:550,short:445},play:{tall:650,short:600},end:{tall:835,short:760}};
/* Operación X · modo incrustado: avisa a la página madre (eXeLearning) cuánto mide el juego
   para que el iframe se ajuste solo, sin barra de desplazamiento interna. Fuera de un iframe no hace nada. */
(function(){
  var emb=false;try{emb=window.self!==window.top}catch(_e){emb=true}
  if(!emb)return;
  var de=document.documentElement;de.classList.add('emb');
  var last=0,raf=0,wasModal=false,AV=0,Z=1;
  var qz=/[?&]oxz=([0-9.]+)/.exec(location.search),ZOK=!!(window.CSS&&CSS.supports&&CSS.supports('zoom','1.1'));
  function post(m){try{parent.postMessage(m,'*')}catch(_e){}}
  function setZ(z){Z=z;de.style.setProperty('--z',String(z))}
  function natural(){de.classList.add('meas');var h=document.body.getBoundingClientRect().height;de.classList.remove('meas');return h}
  /* Escala el juego para aprovechar la pantalla sin que "salte" entre pasos: parte de un valor calculado con la
     altura disponible y la altura típica de la misión, y solo baja si un paso concreto no cabe (nunca por debajo de ~75 %). */
  var ZMAX=0,KEY='';
  function screenType(){return document.querySelector('.reward')?'end':document.querySelector('.intro')?'intro':'play'}
  function zBase(t){
    var R=window.OX_REF||{},r=(R[t]||{tall:850,short:800}),ref=AV<800?r.short:r.tall;
    return Math.max(.8,Math.min(1.3,innerWidth/1060,AV/ref));
  }
  function fitZoom(){
    if(!AV||!document.getElementById('app'))return;
    if(!ZOK){setZ(1);return}
    if(qz){setZ(+qz[1]);return}
    var t=screenType(),k=t+AV+'x'+innerWidth;if(k!==KEY){KEY=k;ZMAX=zBase(t)}
    var pick=.75;
    for(var z=ZMAX;z>=.75;z-=.04){var zz=Math.round(z*100)/100;setZ(zz);if(natural()<=AV){pick=zz;break}}
    setZ(pick);ZMAX=pick;
  }
  window.__oxNatural=function(){return natural()};
  function size(){
    raf=0;
    fitZoom();
    var h=Math.round(document.body.getBoundingClientRect().height);
    if(h&&h!==last){last=h;post({ox:1,t:'size',h:h})}
    var m=!!document.querySelector('.overlay');
    if(m!==wasModal){wasModal=m;post({ox:1,t:m?'modal':'modalend'})}
  }
  function sched(){if(!raf)raf=requestAnimationFrame(size)}
  window.addEventListener('message',function(e){
    var d=e.data;if(!d||d.ox!==1||d.t!=='avail')return;
    de.classList.add('ox-on');
    var h=Math.max(300,Math.round(d.h)),cur=de.style.getPropertyValue('--avail');AV=h;
    if(cur!==h+'px')de.style.setProperty('--avail',h+'px');
    de.classList.toggle('short',h<800);de.classList.toggle('tiny',h<640);sched();
  });
  window.addEventListener('load',function(){sched();post({ox:1,t:'hello'})});
  document.addEventListener('DOMContentLoaded',function(){
    if(window.ResizeObserver)new ResizeObserver(sched).observe(document.body);
    new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  });
  /* al cambiar de pantalla o de reto, pide a la página que vuelva a mostrar el inicio del juego */
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest&&e.target.closest('#start,#next,#replay');
    if(t)setTimeout(function(){post({ox:1,t:'top'})},60);
  },true);
})();
</script>

/* ---------- Estado y persistencia (validado) ---------- */
function sane(d){
  if(!d||d.v!==7||!['intro','play','win'].includes(d.screen))return null;
  const o=d.outcomes,t=d.tried,w=d.wrong,idx=d.idx;
  if(!Array.isArray(o)||o.length>TOTAL||!o.every(x=>OUT.includes(x)))return null;
  const okList=a=>Array.isArray(a)&&a.length<=2&&a.every((x,i)=>Number.isInteger(x)&&x>=0&&x<3&&a.indexOf(x)===i);
  if(!okList(t))return null;
  if(!Number.isInteger(idx)||idx<0||idx>TOTAL)return null;
  if(!Array.isArray(w)||w.length!==idx||!w.every(okList))return null;
  /* retos cerrados: cantidad de errores = resultado, y ninguna «equivocada» es la respuesta */
  for(let i=0;i<w.length;i++)if(o[i]===undefined||w[i].length!==NWRONG[o[i]]||w[i].includes(puzzles[i].answer))return null;
  if(d.screen==='win')return(idx===TOTAL&&o.length===TOTAL&&d.phase==='choose'&&!t.length)?d:null;
  if(idx>=TOTAL)return null;
  const a=puzzles[idx].answer;
  if(d.phase==='choose'){if(o.length!==idx||t.length>1||t.includes(a))return null}
  else if(d.phase==='correct'){if(o.length!==idx+1||t.length>1||t.includes(a)||o[idx]!==(t.length?'second':'first'))return null}
  else if(d.phase==='guided'){if(o.length!==idx+1||t.length!==2||t.includes(a)||o[idx]!=='guided')return null}
  else return null;
  if(d.screen==='intro'&&(idx!==0||o.length||t.length))return null;
  return d;
}
function read(){try{const d=sane(JSON.parse(localStorage.getItem(STORE)));if(d)return{v:7,screen:d.screen,idx:d.idx,phase:d.phase,tried:[...d.tried],outcomes:[...d.outcomes],wrong:d.wrong.map(a=>[...a])}}catch(_e){}return empty()}

const esc=v=>String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));

let soundOn=false,audioCtx=null;
try{soundOn=localStorage.getItem(STORE_SOUND)==='on'}catch(_e){}
function toggleSound(){soundOn=!soundOn;try{localStorage.setItem(STORE_SOUND,soundOn?'on':'off')}catch(_e){}if(soundOn)playSound('tap');render('#sound')}
function audio(){if(!soundOn)return null;try{if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;audioCtx=new A()}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}catch(_e){return null}}
function tone(ctx,at,hz,dur,vol,type='sine',toHz){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(hz,at);if(toHz)o.frequency.exponentialRampToValueAtTime(Math.max(20,toHz),at+dur);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+Math.min(.015,dur/4));g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+dur+.015)}
function playSound(n){const c=audio();if(!c)return;const t=c.currentTime+.012;try{
  if(n==='tap')tone(c,t,600,.042,.015,'triangle',450);
  else if(n==='start')[392,523,659].forEach((h,i)=>tone(c,t+i*.075,h,.145,.024,'triangle',h*1.01));
  else if(n==='wrong'){tone(c,t,260,.13,.021,'sine',220);tone(c,t+.07,205,.11,.012,'triangle',185)}
  else if(n==='right'){tone(c,t,523,.16,.025,'triangle',610);tone(c,t+.075,659,.17,.021);tone(c,t+.15,784,.21,.02)}
  else if(n==='second'){tone(c,t,523,.16,.02,'triangle');tone(c,t+.11,659,.2,.022)}
  else if(n==='guided'){tone(c,t,392,.18,.014,'sine',365);tone(c,t+.1,466,.17,.013,'triangle')}
  else if(n==='next')tone(c,t,410,.08,.013,'triangle',465);
  else if(n==='finish')[392,523,659,784,1046].forEach((h,i)=>tone(c,t+i*.11,h,i===4?.51:.24,i===4?.031:.02,i%2?'sine':'triangle'));
}catch(_e){}}

function track(states,big,todoGlyph){

    const from=i>0?` from-${states[i-1]}`:'';
    const label=s==='ok'?'resuelto':s==='assisted'?'resuelto con ayuda':s==='current'?'en curso':'pendiente';
    return`<li class="n ${s}${from}"><span class="orb" aria-hidden="true">${glyph}</span><span class="nl"><span class="w">Reto </span>${i+1}</span><span class="sr">Reto ${i+1}: ${label}</span></li>`}).join('')}</ol>`}
function trackStates(){return Array.from({length:TOTAL},(_,i)=>{const o=state.outcomes[i];return o==='guided'?'assisted':o?'ok':i===state.idx&&state.screen==='play'?'current':'todo'})}

function piece(c,i,p){
  const done=state.phase!=='choose',tried=state.tried.includes(i),isAns=i===p.answer;
  let cls='piece',badge='',status='';
  if(done&&isAns){cls+=state.phase==='correct'?' right':' reveal';badge=`<span class="badge" aria-hidden="true">${I.check}</span>`;status=', respuesta correcta'}
  else if(tried){cls+=' wrong';badge=`<span class="badge" aria-hidden="true">${I.cross}</span>`;status=', incorrecta'}
  if(fx.shake===i)cls+=' shake';
  const off=done||tried;
  return`<button type="button" class="${cls}" data-answer="${i}" draggable="${!off}" ${off?'aria-disabled="true"':''}><span class="sr">${esc(c.say+status)}</span><span aria-hidden="true">${expr(c.e)}</span>${badge}</button>`}

function fb(kind,icon,title,text,btn,alt){return`<div class="fb ${kind}"><span class="ico" aria-hidden="true">${icon}</span><div><strong>${esc(title)}</strong><p>${fmt(text)}</p></div>${btn?`<button class="next${alt?' alt':''}" id="next" type="button">${btn}</button>`:''}</div>`}
const sgn=n=>(n<0?MINUS:'')+Math.abs(n);
const txt=s=>String(s).replace(/\{([a-z])\}/gi,'$1');
function check(p,i){const c=p.choices[i],t=p.test,val=c.f(t.v);return{c,t,val,ok:val===t.real}}
/* «Boleta de prueba»: misma lógica de comprobación de las misiones 2 y 3 (¿cuadra?), aquí con un número */
function slip(p,i){

  <div class="slipRow"><span class="slipLab">La situación da</span><span class="slipCalc">${esc(t.realCalc)}</span></div></div>
  <div class="slipFoot"><span class="slipCmp" aria-hidden="true"><span>${sgn(val)}</span><i>${ok?'=':'≠'}</i><span>${t.real}</span></span><span class="slipTag">${ok?'CUADRA':'NO CUADRA'}</span></div>
  <p class="slipNote">${ok?'Coinciden: la expresión es correcta.':'No coinciden: no puede ser la correcta.'}</p></div>`}
function slipSpeech(p,i){const{c,t,val,ok}=check(p,i);return`Prueba con x igual a ${t.v}: ${plain(c.say)} da ${sgn(val)} y la situación da ${t.real}. ${ok?'Cuadra.':'No cuadra.'}`}

function feedback(p){
  const last=state.idx===TOTAL-1,ans=p.answer;

  return`<section class="reward" aria-labelledby="victory">${confetti()}<div class="eyebrow">Misión 1 de ${NM} superada</div><h1 id="victory" tabindex="-1">¡Clave 1 recuperada${nick?', '+esc(nick):''}!</h1><p class="lead">Completaron los cinco retos. Ya tienen la primera clave del código; faltan ${NM-1}.</p>
  <div class="rewardGrid"><div class="keyCol"><div class="keyStage"><div class="keyPlate"><span>CLAVE 1</span><strong>${KEY1}</strong><small>RECUPERADA</small></div></div><div class="codeStrip" role="img" aria-label="Código: ${KEY1} y ${NM-1} claves pendientes"><b>${KEY1}</b>${'<span>?</span>'.repeat(NM-1)}</div><p class="keyNote">Anoten el 4: lo necesitarán para abrir el candado final junto con las otras claves.</p></div>
  <div class="report"><p class="score"><span class="big">${sc}<small> / ${MAX} puntos · Misión 1</small></span><span class="rank">Rango: <b>${rank}</b></span></p>
  <ul class="results" aria-label="Resultado de cada reto">${res}</ul>
  ${badges()}<h2 class="whyTitle">¿Por qué la clave es 4?</h2>
  <ul class="ideas"><li><span class="op" aria-hidden="true">+</span><span><b>Se agrega</b><span class="ex"><i class="v">x</i> + 5</span></span></li><li><span class="op" aria-hidden="true">−</span><span><b>Se quita</b><span class="ex"><i class="v">x</i> − 4</span></span></li><li><span class="op" aria-hidden="true">×</span><span><b>Se repite</b><span class="ex">3<i class="v">x</i></span></span></li><li><span class="op" aria-hidden="true">÷</span><span><b>Se reparte</b><span class="ex">${expr('{x}/4')}</span></span></li></ul>
  <p class="whyNote">Usaron las cuatro operaciones y, en el último reto, las combinaron: 2(<i class="v">x</i> + 3). Resolvieron ${sol} de ${TOTAL} retos sin ayuda.</p></div></div>
  <div class="rewardActions"><p class="whyNote" style="flex-basis:100%;text-align:center;margin:0">Sigan con la Misión 2, <em>Guardianes del equilibrio</em>, cuando su docente lo indique.</p><button class="primary" id="copy" type="button">Copiar resultado para el docente</button><button class="ghost" id="replay" type="button">Nuevo equipo · jugar de nuevo</button></div></section>`}


/* ---------- Juego: agente, confeti, insignias, reporte ---------- */
function agent(){const w=esc(nick||'Equipo'),ro=role(state.idx);let m;
 if(state.phase==='correct')m=(state.outcomes[state.idx]==='first'?`¡Eso es, ${w}! Conexión activada.`:`¡Bien, ${w}! Lo corrigieron y conectaron.`)+(ROLES?` Integrante ${ro.v}, lea la prueba en voz alta.`:'');
 else if(state.phase==='guided')m='Sin afán: lo importante es entender el porqué. Comparen la prueba con la situación.';
 else if(state.tried.length)m='Casi. Miren la prueba y prueben otra expresión.';
 else m=`${w}, la conexión ${state.idx+1} está dañada.`+(ROLES?` Integrante ${ro.l} lee la situación y ${ro.p} propone la expresión.`:' ¡Ustedes pueden!');
 return`<div class="agent"><span class="av" aria-hidden="true">🤖</span><p>${m}</p></div>`}
function confetti(){return`<div class="confetti" aria-hidden="true">${Array.from({length:28},(_,i)=>`<i style="left:${(i*37)%100}%;background:${['#f7bb53','#60dec1','#ff7a59','#fff'][i%4]};animation-delay:${(i%7)*.18}s;animation-duration:${2.6+(i%5)*.35}s"></i>`).join('')}</div>`}
function badges(){const o=state.outcomes,b=['🏅 Insignia: Descifradores del código'];
 if(o.every(x=>x==='first'))b.push('⭐ Mente maestra');
 else if(o.every(x=>x!=='guided'))b.push('🛡️ Sin ayuda');
 if(o.join().includes('first,first,first'))b.push('🔥 Racha de 3');
 if(o.includes('guided'))b.push('💪 Persistente');
 return`<ul class="badges" aria-label="Insignia y logros">${b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function copyReport(){
  const c={first:0,second:0,guided:0};state.outcomes.forEach(o=>c[o]++);
  const lab={first:'1.er intento',second:'2.º intento',guided:'con ayuda'};
  const det=state.outcomes.map((o,i)=>{const w=(state.wrong[i]||[]).map(k=>txt(puzzles[i].choices[k].e));return`R${i+1}: ${lab[o]}${w.length?' (eligió '+w.join(' y ')+')':''}`}).join('; ');
  const t=`Operación X · Misión 1 de ${NM} | Equipo: ${nick||'sin nombre'} | Puntos: ${score()}/${MAX} | 1.er intento: ${c.first}, 2.º intento: ${c.second}, con ayuda: ${c.guided} | Clave 1: ${KEY1} | Detalle: ${det}`;
  const success=()=>{const el=document.getElementById('copy');if(el)el.textContent='¡Copiado! Pásenselo a su docente';announce('Resultado copiado.')};
  const manual=()=>{const el=openModal('',`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="reportTitle"><h2 id="reportTitle">Copien el resultado</h2><p>El navegador no permitió copiarlo automáticamente. Seleccionen este texto y cópienlo:</p><textarea id="reportText" readonly aria-label="Resultado para copiar" style="display:block;width:100%;min-height:150px;margin:14px 0 18px;padding:12px;border:2px solid #8ca9a0;border-radius:12px;font:14px/1.5 system-ui;color:#17323c;background:#fffaf0">${esc(t)}</textarea><button type="button" class="primary" data-close>Listo</button></section>`);const ta=el.querySelector('#reportText');if(ta){ta.focus({preventScroll:true});ta.select()}};
  const fallback=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(a);a.select();let ok=false;try{ok=Boolean(document.execCommand('copy'))}catch(_e){}a.remove();ok?success():manual()};
  try{if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){navigator.clipboard.writeText(t).then(success,fallback)}else fallback()}catch(_e){fallback()}
}

/* ---------- Render y foco ---------- */
function announce(t){const l=document.getElementById('live');if(!l)return;l.textContent='';setTimeout(()=>{l.textContent=t},60)}
function render(focusSel){
  const app=document.getElementById('app');
  app.innerHTML=shell(state.screen==='intro'?intro():state.screen==='play'?play():finish());
  bind();fx={};
  if(focusSel){const el=app.querySelector(focusSel);if(el)try{el.focus({preventScroll:true})}catch(_e){}}
}
function keepInView(sel){try{const el=document.querySelector(sel);if(!el)return;const r=el.getBoundingClientRect(),b=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';if(r.bottom>innerHeight)scrollBy({top:r.bottom-innerHeight+16,behavior:b});else if(r.top<0)scrollBy({top:r.top-16,behavior:b})}catch(_e){}}
function toTop(){try{if(scrollY>0)scrollTo({top:0,behavior:'auto'})}catch(_e){}}

/* ---------- Acciones ---------- */
function start(){const ni=document.getElementById('nick');if(ni){nick=ni.value.trim().slice(0,14);try{localStorage.setItem(NK,nick)}catch(_e){}}playSound('start');state.screen=state.idx>=TOTAL?'win':'play';save();render(state.screen==='win'?'#victory':'#prompt');toTop()}
function pick(i){
  if(state.screen!=='play'||state.phase!=='choose'||!Number.isInteger(i)||i<0||i>=3||state.tried.includes(i))return;
  const p=cur();
  if(i===p.answer){
    const first=state.tried.length===0;
    state.outcomes[state.idx]=first?'first':'second';state.phase='correct';fx={points:true};
    playSound(first?'right':'second');save();render('#next');
    announce(`¡Conexión activada! Más ${first?10:5} puntos. ${plain(p.explain)} ${slipSpeech(p,p.answer)}`);keepInView('.fbSlot');
  }else{
    state.tried.push(i);fx={shake:i};playSound('wrong');
    if(state.tried.length>=2){state.phase='guided';state.outcomes[state.idx]='guided';save();render('#next');announce(`Conexión reparada con ayuda, cero puntos. ${plain(p.explain)} ${slipSpeech(p,p.answer)}`)}
    else{save();render('.piece:not([aria-disabled="true"])');announce(`Todavía no conecta. ${plain(p.choices[i].why)} Pista: ${plain(p.hint)} ${slipSpeech(p,i)}`)}
    keepInView('.fbSlot');
  }
}
function advance(){
  if(state.phase==='choose')return;
  const wasOk=state.phase==='correct';
  state.wrong.push([...state.tried]);state.idx+=1;state.tried=[];state.phase='choose';state.screen=state.idx>=TOTAL?'win':'play';
  if(state.screen==='win')playSound('finish');else if(wasOk)playSound('next');
  save();render(state.screen==='win'?'#victory':'#prompt');toTop();
  if(state.screen==='play')announce(`Reto ${state.idx+1} de ${TOTAL}.`);
}
function reset(keepNick){
  if(!keepNick){nick='';wipeAll()} /* equipo nuevo: borra nombre, claves, puntos y avance de las tres misiones */
  else{removeClave();removePts()} /* reiniciar misión: solo borra lo de esta misión */
  state=empty();playSound('start');save();render('#start');toTop();
}

/* ---------- Ventanas modales (sin window.confirm: funciona dentro de iframes) ---------- */
let modal=null;
function openModal(cls,html){
  closeModal(true);
  const layer=document.createElement('div');layer.className='overlay '+cls;layer.innerHTML=html;
  modal={layer,opener:document.activeElement};
  document.body.append(layer);document.body.classList.add('lock');
  document.getElementById('app').setAttribute('inert','');
  layer.addEventListener('mousedown',e=>{if(e.target===layer)closeModal()});
  layer.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal()));
  (layer.querySelector('[data-autofocus]')||layer.querySelector('button')).focus({preventScroll:true});
  return layer;
}
function closeModal(silent){
  if(!modal)return;const m=modal;modal=null;m.layer.remove();
  document.body.classList.remove('lock');document.getElementById('app').removeAttribute('inert');
  if(silent)return;
  const back=m.opener&&document.contains(m.opener)?m.opener:document.querySelector('#prompt,#victory,#introTitle');
  try{back&&back.focus({preventScroll:true})}catch(_e){}
}
document.addEventListener('keydown',e=>{
  if(!modal)return;
  if(e.key==='Escape'){e.preventDefault();closeModal();return}
  if(e.key==='Tab'){
    const items=[...modal.layer.querySelectorAll('button,[href],[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!items.length)return;const first=items[0],last=items[items.length-1];
    if(!modal.layer.contains(document.activeElement)){e.preventDefault();first.focus()}
    else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
function openHelp(){
  playSound('tap');
  const l=openModal('','<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><h2 id="helpTitle">¿Cómo se juega?</h2><ul><li><strong>Lean</strong> la situación y <strong>elijan</strong> la expresión que la representa.</li><li>La <strong>prueba con un número</strong> comprueba la expresión: si cuadra con la situación, es la correcta.</li><li>Ganan <strong>10 puntos</strong> si aciertan al primer intento y <strong>5</strong> al segundo.</li><li>Tras dos errores revisan la solución con ayuda y siguen sin puntos.</li>'+(ROLES?'<li>En cada reto se turnan: un integrante lee la situación, otro propone la expresión y otro lee la prueba.</li>':'')+'<li>Usen <strong>Ver ejemplo</strong> cuando lo necesiten.</li></ul><button type="button" class="primary" data-close data-autofocus>Volver al juego</button>'+(state.screen!=='intro'?'<button type="button" class="linkBtn" id="resetInHelp">Reiniciar misión</button>':'')+'</section>');
  l.querySelector('#resetInHelp')?.addEventListener('click',()=>{closeModal(true);confirmReset(true)});
}
function confirmReset(keepNick){
  const l=openModal('',`<section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="rsTitle" aria-describedby="rsText"><h2 id="rsTitle">${keepNick?'¿Reiniciar la misión?':'¿Empezar con un equipo nuevo?'}</h2><p id="rsText">${keepNick?'Se borrarán los puntos y el avance de esta misión. El nombre del equipo se conserva.':'Se borrarán el nombre del equipo, las claves, los puntos y el avance de las tres misiones.'}</p><div class="dialogRow"><button type="button" data-close data-autofocus>Cancelar</button><button type="button" class="danger" id="rsYes">${keepNick?'Sí, reiniciar':'Sí, empezar'}</button></div></section>`);
  l.querySelector('#rsYes').addEventListener('click',()=>{closeModal(true);reset(keepNick)});
}
function openExample(){
  if(state.screen!=='play')return;const eg=cur().example;playSound('tap');
  openModal('side',`<section class="exampleCard" role="dialog" aria-modal="true" aria-labelledby="exTitle"><div class="exampleTop"><span>TARJETA DE APOYO</span><button type="button" class="closeX" data-close aria-label="Cerrar tarjeta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="exampleBody"><p class="exampleLabel">EJEMPLO PARECIDO</p><h2 id="exTitle">${fmt(eg.situation)}</h2><div class="studyBoard" role="img" aria-label="${esc(eg.say)}"><span class="studyEq">${expr(eg.formula)}</span></div><p class="exampleDetail">${fmt(eg.detail)}</p></div><div class="exampleFoot"><button class="next" type="button" data-close data-autofocus>Volver al juego</button></div></section>`);
}

/* ---------- Eventos ---------- */
function bind(){
  const by=id=>document.getElementById(id);
  by('sound')?.addEventListener('click',toggleSound);
  by('help')?.addEventListener('click',openHelp);
  by('example')?.addEventListener('click',openExample);
  by('start')?.addEventListener('click',start);
  by('next')?.addEventListener('click',advance);
  by('replay')?.addEventListener('click',()=>confirmReset(false));
  by('copy')?.addEventListener('click',copyReport);
  by('nick')?.addEventListener('keydown',e=>{if(e.key==='Enter')start()});
  const sk=by('socket');
  if(sk){
    sk.addEventListener('dragover',e=>{if(state.phase!=='choose')return;e.preventDefault();sk.classList.add('drop')});
    sk.addEventListener('dragleave',()=>sk.classList.remove('drop'));
    sk.addEventListener('drop',e=>{e.preventDefault();sk.classList.remove('drop');const raw=e.dataTransfer.getData('text/plain');if(/^[0-2]$/.test(raw))pick(Number(raw))});
  }
  document.querySelectorAll('[data-answer]').forEach(b=>{
    const i=Number(b.dataset.answer);
    b.addEventListener('click',()=>pick(i));
    b.addEventListener('dragstart',e=>{if(b.getAttribute('aria-disabled')==='true'){e.preventDefault();return}e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'});
  });
}
render();
})();

</script>
