      frame.style.setProperty('overflow','hidden','important');
      frame.setAttribute('width','100%');
      frame.setAttribute('height',String(height));
      frame.setAttribute('scrolling','no');
      ensureParentRule(frame);
      if(parentStyle&&frameSelector){
        parentStyle.textContent=`${frameSelector}{width:100%!important;max-width:100%!important;height:${height}px!important;min-height:0!important;overflow:hidden!important;display:block!important;border:0!important;}`;
      }
    }catch(e){}
  }
  function report(){
    pending=false;
    const h=contentHeight();
    if(!h)return;
    if(Math.abs(h-lastHeight)>=2||lastHeight===0)lastHeight=h;
    apply(lastHeight||h);
    try{
      if(window.parent&&window.parent!==window){
        window.parent.postMessage({type:SOURCE,height:lastHeight||h},'*');
      }
    }catch(e){}
  }
  function schedule(){
    if(pending)return;
    pending=true;
    requestAnimationFrame(()=>requestAnimationFrame(report));
  }
  function burst(){
    schedule();
    setTimeout(schedule,50);
    setTimeout(schedule,140);
    setTimeout(schedule,300);
    setTimeout(schedule,650);
  }
  window.addEventListener('load',burst,{once:true});
  window.addEventListener('resize',burst,{passive:true});
  document.addEventListener('click',burst,true);
  document.addEventListener('change',burst,true);
  document.addEventListener('transitionend',burst,true);
  document.addEventListener('animationend',burst,true);
  if(document.fonts?.ready)document.fonts.ready.then(burst).catch(()=>{});
  const root=document.querySelector('.s2-shell')||document.body;
  if('ResizeObserver' in window&&root)new ResizeObserver(burst).observe(root);
  if('MutationObserver' in window&&root)new MutationObserver(burst).observe(root,{
    subtree:true,childList:true,attributes:true,characterData:true
  });
  [90,250,600,1200,2200].forEach(d=>setTimeout(burst,d));
})();
</script></body></html>
